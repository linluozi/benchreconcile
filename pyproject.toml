[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchreconcile"
version = "0.1.0"
description = "Reconcile published benchmark claims with raw per-sample evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
benchreconcile = "benchreconcile.cli:main"

[tool.setuptools]
packages = ["benchreconcile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"